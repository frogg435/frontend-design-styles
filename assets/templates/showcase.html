<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四种前端设计语言 · 组件对照</title>
<style>
/* ==========================================================================
   0. 页面外壳（中性样式，不属于任何设计体系）
   ========================================================================== */
:root {
  --shell-bg: #0E0F12;
  --shell-surface: #17181D;
  --shell-line: #26272E;
  --shell-line-hover: #3A3C45;
  --shell-bg-translucent: rgba(14, 15, 18, 0.82);
  --shell-text: #F2F3F5;
  --shell-muted: #8B8F9A;
  --shell-accent: #6C7BFF;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--shell-bg);
  color: var(--shell-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Microsoft YaHei", "Noto Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
  padding: 14px 24px;
  background: var(--shell-bg-translucent);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--shell-line);
}
.topbar h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.topbar .sub { font-size: 12px; color: var(--shell-muted); margin-left: -8px; }

.filters { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.filters button {
  font: inherit; font-size: 12px; font-weight: 500;
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--shell-line);
  background: transparent; color: var(--shell-muted);
  cursor: pointer; transition: all 160ms cubic-bezier(0.2,0,0,1);
}
.filters button:hover { color: var(--shell-text); border-color: var(--shell-line-hover); }
.filters button[aria-pressed="true"] {
  background: var(--shell-accent); border-color: var(--shell-accent); color: #fff;
}
.theme-btn {
  font: inherit; font-size: 13px;
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--shell-line); background: transparent;
  color: var(--shell-text); cursor: pointer;
}
.theme-btn:hover { border-color: var(--shell-line-hover); }

main { padding: 32px 24px 96px; max-width: 1400px; margin: 0 auto; }

.block { margin-bottom: 64px; scroll-margin-top: 88px; }
.block-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.block-head .idx {
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 5px 10px; border-radius: 8px; margin-top: 2px;
  background: var(--shell-surface); border: 1px solid var(--shell-line);
  color: var(--shell-muted);
}
.block-head h2 { font-size: 22px; margin: 0 0 4px; font-weight: 650; letter-spacing: -0.01em; }
.block-head p { margin: 0; font-size: 13px; color: var(--shell-muted); line-height: 1.6; }
.block-head .swatches { display: flex; gap: 6px; margin-top: 10px; }
.block-head .swatches i {
  width: 22px; height: 22px; border-radius: 6px; display: block;
  border: 1px solid rgba(255,255,255,0.12);
}

.stage {
  padding: 24px; border-radius: 20px;
  border: 1px solid var(--shell-line);
  display: grid; gap: 20px;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}

.panel { border-radius: 16px; padding: 18px; }
.panel > h3 {
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; opacity: 0.55; margin: 0 0 14px;
}
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.hide { display: none !important; }

  border-radius: var(--fl-radius-medium);
  transition: border-color var(--fl-duration-normal) var(--fl-curve-easy-ease);
}

  font-family: var(--fl-font); font-size: 14px; color: var(--fl-neutral-fg1); min-width: 0;
}

}

}

  border: none; background: transparent; cursor: pointer; color: var(--fl-neutral-fg3);
  padding: 8px 16px 10px; transition: color var(--fl-duration-normal) var(--fl-curve-easy-ease);
}
[data-style="fluent"] .u-seg button:hover { color: var(--fl-neutral-fg1); }

[data-style="fluent"] .u-seg button[aria-pressed="true"]::after {

  height: 2px; border-radius: 1px; background: var(--fl-brand);

</head>
<body>

<header class="topbar">
  <h1>四种前端设计语言 · 组件对照</h1>
  <span class="sub">同一套组件，四套视觉语法</span>
  <div class="filters" id="filters">
    <button data-filter="all" aria-pressed="true">全部</button>
    <button data-filter="miuix" aria-pressed="false">MIUIX</button>
    <button data-filter="apple" aria-pressed="false">Apple HIG</button>
    <button data-filter="material" aria-pressed="false">Material 3</button>
    <button data-filter="fluent" aria-pressed="false">Fluent 2</button>
  </div>
  <button class="theme-btn" id="themeBtn" title="切换明暗模式">◐</button>
</header>

<main id="main"></main>

<script>
/* -------------------------------------------------------------------------- */
/* 组件模板：同一结构，四种风格由 [data-style] 作用域下的 CSS 接管              */
/* -------------------------------------------------------------------------- */
const panels = () => `
  <div class="panel">
    <h3>按钮 Buttons</h3>
    <div class="row">
      <button class="u-btn u-btn--primary">主要操作</button>
      <button class="u-btn u-btn--secondary">次要操作</button>
      <button class="u-btn u-btn--ghost">文字按钮</button>
      <button class="u-btn u-btn--disabled" disabled>已禁用</button>
    </div>
  </div>

  <div class="panel">
    <h3>表单 Input</h3>
    <div class="stack">
      <div class="u-field">
        <input type="text" placeholder="请输入内容…" aria-label="示例输入框">
      </div>
      <div class="row">
        <label class="u-switch">
          <input type="checkbox" checked aria-label="示例开关"><span></span>
        </label>
        <span style="font-size:13px;opacity:.65">通知开关</span>
      </div>
      <div class="u-seg" role="group">
        <button aria-pressed="true">日</button>
        <button aria-pressed="false">周</button>
        <button aria-pressed="false">月</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h3>卡片 Card</h3>
    <div class="u-card">
      <div style="font-size:16px;font-weight:600;margin-bottom:6px">卡片标题</div>
      <div style="font-size:13px;opacity:.62;line-height:1.6">
        卡片内边距、圆角与阴影各自遵循所属体系的规则。
      </div>
      <div class="row" style="margin-top:14px">
        <span class="u-chip">标签一</span>
        <span class="u-chip">标签二</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <h3>列表 List</h3>
    <div class="u-list">
      <div class="u-list__row">
        <div>
          <div class="u-list__title">账号与安全</div>
          <div class="u-list__sub">密码、双重验证</div>
        </div>
        <span class="u-list__chev">›</span>
      </div>
      <div class="u-list__row">
        <div>
          <div class="u-list__title">通知设置</div>
          <div class="u-list__sub">推送、免打扰</div>
        </div>
        <span class="u-list__chev">›</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <h3>反馈 Feedback</h3>
    <div class="u-info"><span>⚠</span><span>账号或密码不正确，请重新输入。</span></div>
  </div>
`;

const STYLES = [
  {
    id: 'miuix',
    name: 'MIUIX · 小米 HyperOS',
    desc: '圆润通透、大圆角、胶囊按钮。主色 <code>#3482FF</code>，靠 <code>#FFFFFF / #F7F7F7 / #E8E8E8</code> 色阶分层，几乎不用阴影。暗色背景是 <code>#242424</code> 而非纯黑。',
    swatch: ['#3482FF', '#5D9BFF', '#EAF2FF', '#E94634', '#F7F7F7']
  },
  {
    id: 'apple',
    name: 'Apple HIG · iOS',
    desc: '克制、留白、内容优先。tint <code>#007AFF</code> 只出现在可交互元素上，靠材质模糊与内缩分组列表划分层级，点击目标 ≥ 44pt。',
    swatch: ['#007AFF', '#34C759', '#FF3B30', '#F2F2F7', '#8E8E93']
  },
  {
    id: 'material',
    name: 'Material Design 3',
    desc: '角色化配色，基线主色 <code>#6750A4</code>。层次由色调叠加（tonal overlay）表达而非阴影；卡片 12dp、FAB 与弹窗 28dp、按钮全圆角。',
    swatch: ['#6750A4', '#625B71', '#7D5260', '#B3261E', '#EADDFF']
  },
  {
    id: 'fluent',
    name: 'Microsoft Fluent 2',
    desc: '生产力取向，紧凑密度（控件高 32px）、小圆角（控件 4px / 浮层 8px）。品牌色 <code>#0F6CBD</code>，标志性细节是控件底边描边更深一档。',
    swatch: ['#0F6CBD', '#115EA3', '#107C10', '#C50F1F', '#F5F5F5']
  }
];

/* 渲染 */
const main = document.getElementById('main');
main.innerHTML = STYLES.map((s, i) => `
  <section class="block" data-style="${s.id}" data-block="${s.id}">
    <div class="block-head">
      <span class="idx">0${i + 1}</span>
      <div>
        <h2>${s.name}</h2>
        <p>${s.desc}</p>
        <div class="swatches">${s.swatch.map(c => `<i style="background:${c}"></i>`).join('')}</div>
      </div>
    </div>
    <div class="stage">${panels()}</div>
  </section>
`).join('');

/* 交互：分段控件 */
document.addEventListener('click', e => {
  const btn = e.target.closest('.u-seg button');
  if (!btn) return;
  [...btn.parentElement.children].forEach(b => b.setAttribute('aria-pressed', b === btn));
});

/* 过滤 */
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('button[data-filter]');
  if (!btn) return;
  const f = btn.dataset.filter;
  [...e.currentTarget.children].forEach(b => b.setAttribute('aria-pressed', b === btn));
  document.querySelectorAll('[data-block]').forEach(el => {
    el.classList.toggle('hide', f !== 'all' && el.dataset.block !== f);
  });
});

/* 明暗切换：写到每个风格容器上，各自吃自己体系的暗色令牌 */
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  document.querySelectorAll('[data-style]').forEach(el => { el.dataset.theme = next; });
});
</script>
</body>
</html>
